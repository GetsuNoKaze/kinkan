name: Bug report
description: Create a report to help us improve
title: "[Bug] "
labels: ["bug"]
body:
  - type: checkboxes
    id: ensure
    attributes:
      label: Verify steps
      description: "
在提交之前，请确认
Please verify that you've followed these steps
"
      options:
        - label: "
确保你使用的是**本仓库**最新的 Citrus main 或 dev 版本
Ensure you are using the latest Citrus build from the main or dev branch of **this repository**.
"
          required: true
        - label: "
如果你可以自己 debug 并解决的话，提交 PR 吧
Is this something you can **debug and fix**? Send a pull request! Bug fixes and documentation fixes are welcome.
"
          required: false
        - label: "
我已经在 [Issue Tracker](https://github.com/getmikan/Citrus/issues) 中找过我要提出的问题
I have searched the [issue tracker](https://github.com/getmikan/Citrus/issues) for a related issue.
"
          required: true
        - label: "
我已经使用 main 分支版本测试过，问题依旧存在
I have tested using the main branch, and the issue still exists.
"
          required: true
        - label: "
我已经仔细看过 [Documentation](https://wiki.metacubex.one/) 并无法自行解决问题
I have read the [documentation](https://wiki.metacubex.one/) and was unable to solve the issue.
"
          required: true
        - label: "
这是本仓库 Citrus 核心的问题
This report concerns the Citrus core built from this repository.
"
          required: true
  - type: input
    attributes:
      label: Citrus version
      description: "use `citrus -v`"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: What OS are you seeing the problem on?
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - OpenBSD/FreeBSD
  - type: textarea
    attributes:
      render: yaml
      label: "Citrus config"
      description: "
在下方附上 Citrus core 配置文件，请确保配置文件中没有敏感信息（比如：服务器地址，密码，端口等）
Paste the Citrus core configuration file below, please make sure that there is no sensitive information in the configuration file (e.g., server address/url, password, port)
"
    validations:
      required: true
  - type: textarea
    attributes:
      render: shell
      label: Citrus log
      description: "
在下方附上 Citrus Core 的日志，log level 使用 DEBUG
Paste the Citrus core log below with the log level set to `DEBUG`.
"
  - type: textarea
    attributes:
      label: Description
    validations:
      required: true
