# A donation to a goal, as Tribute's webhook reported it through the Worker in
# tools/tribute-worker (it checks Tribute's signature and sends only the goal, the amount and
# the currency, nothing about the donor). The donation is counted once into donations.json
# on the "updates" release, the goals are signed again with it and the site is rebuilt.
name: donations

on:
  repository_dispatch:
    types: [tribute-donation]

permissions: {}

jobs:
  count:
    runs-on: ubuntu-24.04
    # The same index the releases and the goals workflow write: one writer at a time.
    concurrency:
      group: release-index
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: count
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          # The payload goes in as data, never into the script: mikan-release checks each
          # field before it counts anything.
          DONATION_KEY: ${{ github.event.client_payload.key }}
          DONATION_REQUEST: ${{ github.event.client_payload.request_id }}
          DONATION_NAME: ${{ github.event.client_payload.name }}
          DONATION_AMOUNT: ${{ github.event.client_payload.amount }}
          DONATION_CURRENCY: ${{ github.event.client_payload.currency }}
        run: |
          mkdir -p updates dist
          gh release download updates -p index.json -p index.json.sig -D updates
          gh release download updates -p donations.json -D updates || true
          go run ./cmd/mikan-release donation -goals .github/goals.json -ledger updates/donations.json -out dist/donations.json \
            -key "$DONATION_KEY" -request-id "${DONATION_REQUEST:-0}" -name "$DONATION_NAME" -amount "$DONATION_AMOUNT" -currency "$DONATION_CURRENCY"
          go run ./cmd/mikan-release goals -file .github/goals.json -ledger dist/donations.json -in updates/index.json -out dist
          gh release upload updates dist/donations.json dist/index.json dist/index.json.sig --clobber
      - name: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
