name: published image check
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify and test
        default: v0.5.0.5-tt.3
        required: true
  push:
    branches: [main]
    paths:
      - .github/workflows/published-image-check.yml
      - test/e2e/compose.published.yaml
      - test/e2e/run.sh
      - test/e2e/e2e_test.go
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: image_test
          POSTGRES_PASSWORD: image_test
          POSTGRES_DB: image_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U image_test -d image_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: verify released manifest
        env:
          TAG: ${{ inputs.tag || 'v0.5.0.5-tt.3' }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]
          mkdir -p "$RUNNER_TEMP/release"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          curl -fsSL "$base/manifest.json" -o "$RUNNER_TEMP/release/manifest.json"
          curl -fsSL "$base/manifest.json.sig" -o "$RUNNER_TEMP/release/manifest.json.sig"
          go run ./cmd/mikan-release verify "$RUNNER_TEMP/release/manifest.json"
          test "$(jq -r .version "$RUNNER_TEMP/release/manifest.json")" = "${TAG#v}"
          image=$(jq -r '.image + "@" + .digest' "$RUNNER_TEMP/release/manifest.json")
          echo "E2E_IMAGE=$image" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: released binaries on both architectures
        run: |
          for arch in amd64 arm64; do
            # The runner's classic image store cannot hold both platforms under one index digest.
            digest=$(docker manifest inspect "$E2E_IMAGE" | jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            test -n "$digest"
            test "$(docker run --rm --platform linux/$arch "${E2E_IMAGE%@*}@$digest" version)" = "$RELEASE_VERSION"
          done
      - name: Docker Hub images through mirror
        run: |
          for img in $(sed -n -E 's/^\s*image:\s*([^ #]+).*/\1/p; s/^FROM\s+([^ ]+).*/\1/p' test/e2e/compose.yaml test/e2e/Dockerfile | sort -u); do
            case "$img" in
              */*) case "${img%%/*}" in *.* | *:*) continue ;; esac; src="mirror.gcr.io/$img" ;;
              *) src="mirror.gcr.io/library/$img" ;;
            esac
            docker pull -q "$src" && docker tag "$src" "$img"
          done
      - name: released panel with PostgreSQL, migrations and restart
        run: |
          docker run -d --name published-panel --network host --read-only \
            --cap-drop ALL --cap-add NET_BIND_SERVICE --tmpfs /tmp \
            -v published-panel-data:/data \
            -e MIKAN_DATABASE_URL='postgres://image_test:image_test@127.0.0.1:5432/image_test?sslmode=disable' \
            -e MIKAN_DEV=1 -e MIKAN_PANEL_LISTEN=127.0.0.1:22053 -e MIKAN_NODE_SOCKET=off \
            "$E2E_IMAGE" serve
          test "$(docker inspect -f '{{.Config.User}}' published-panel)" = '65532:65532'
          wait_health() {
            for i in $(seq 1 30); do
              if docker exec published-panel /usr/local/bin/mikan health; then return 0; fi
              sleep 2
            done
            docker logs published-panel
            return 1
          }
          wait_health
          docker restart published-panel
          wait_health
      - name: all node e2e tests against the released image, then restart
        env:
          E2E_RESTART: "1"
        run: sh test/e2e/run.sh
      - name: diagnostics
        if: failure()
        run: docker ps -a && docker image ls
      - name: panel logs and cleanup
        if: always()
        run: |
          docker logs published-panel 2>&1 || true
          docker rm -f published-panel || true
